name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Marke prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tokens, Kontraste, erzeugte Dateien und SVGs prüfen
        run: python3 werkzeuge/marke.py pruefen
      - name: Tests für marke.py
        run: python3 -m unittest discover -s tests/werkzeug -v

  raster:
    name: Rasterbilder neu erzeugen
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: rsvg-convert installieren
        run: |
          for versuch in 1 2 3; do
            if sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends librsvg2-bin; then
              exit 0
            fi
            echo "Versuch $versuch gescheitert, nächster in 20 s"
            sleep 20
          done
          exit 1
      # Die Bilder entstehen mit einem festen Werkzeug, nicht von Hand. Hier
      # zeigt sich, dass der Befehl läuft und Bilder in den richtigen Maßen
      # liefert. Die Bytes hängen an der Version von librsvg: Nur wenn
      # rsvg-convert hier dieselbe Version hat, mit der die eingecheckten
      # Bilder entstanden sind (exporte/raster/quellen.json, vor dem Erzeugen
      # gelesen, denn raster schreibt die Liste neu), müssen die neuen Bilder
      # den eingecheckten gleichen (#8). Sonst hält sich die Prüfung an die
      # Prüfsummen der Quellen.
      - name: Rasterbilder erzeugen und prüfen
        run: |
          soll=$(python3 -c 'import json; print(json.load(open("exporte/raster/quellen.json", encoding="utf-8"))["werkzeug"])')
          ist=$(rsvg-convert --version | head -n 1)
          python3 werkzeuge/marke.py raster
          python3 werkzeuge/marke.py pruefen
          if [ "$ist" = "$soll" ]; then
            git diff --exit-code --stat -- exporte/raster
            echo "Rasterbilder byte-gleich mit den eingecheckten ($ist)."
          else
            echo "Rasterbilder nicht byteweise verglichen: $ist, eingecheckt mit $soll."
          fi
